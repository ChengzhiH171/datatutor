<script>
// ============================================================
// 初始化
// ============================================================
var courseId = (new URLSearchParams(window.location.search)).get('course_id');
if (!courseId) {
    alert('请从章节页面选择课程进入');
    window.location.href = 'hub.html';
}
var subtasks = [];          // [{id, name, command, expected_output, knowledge_text}]
var currentSubtaskIdx = 0;
var subStatuses = {};       // {subtask_id: 'pending'|'in_progress'|'completed'}
var taskHistories = {};
var sessionStartTime = 0;     // 由后端 API 设置
var sessionTimer = null;    // 计时器句柄

// 实训时长追踪（从后端获取，localStorage 兜底）
function initTrainingHours() {
    return API.getTrainingTime().then(function(d) {
        var total = d.total_seconds || 0;
        localStorage.setItem('dt_training_seconds', total);
        updateTrainingDisplay(total);
        // 当前有进行中子任务 → 记录开始时间
        if (d.current_started_at) {
            sessionStartTime = new Date(d.current_started_at).getTime();
        } else {
            var saved = localStorage.getItem('dt_session_start');
            if (saved) sessionStartTime = parseInt(saved);
        }
        // 数据就绪后才启动计时器
        startElapsedTimer();
        setInterval(tickTrainingHours, 60000);
    }).catch(function() {
        var total = parseInt(localStorage.getItem('dt_training_seconds') || '0');
        var saved = localStorage.getItem('dt_session_start');
        if (saved) sessionStartTime = parseInt(saved);
        updateTrainingDisplay(total);
        startElapsedTimer();
        setInterval(tickTrainingHours, 60000);
    });
}
function updateTrainingDisplay(total) {
    var el = document.getElementById('training-hours');
    var bar = document.getElementById('training-bar');
    var hours = (total / 3600).toFixed(1);
    if (el) el.innerText = hours + 'h';
    if (bar) bar.style.width = Math.min((total / (30 * 3600)) * 100, 100) + '%';
}

function tickTrainingHours() {
    var total = parseInt(localStorage.getItem('dt_training_seconds') || '0');
    total += 60;
    localStorage.setItem('dt_training_seconds', total);
    updateTrainingDisplay(total);
    API.getTrainingTime().then(function(){}).catch(function(){});
}

// 耗时计时器
function startElapsedTimer() {
    if (sessionTimer) clearInterval(sessionTimer);
    if (!sessionStartTime) sessionStartTime = Date.now();
    sessionTimer = setInterval(function() {
        var elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
        var h = Math.floor(elapsed / 3600);
        var m = Math.floor((elapsed % 3600) / 60);
        var s = elapsed % 60;
        var el = document.getElementById('dash-elapsed');
        if (el) el.innerText = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    }, 1000);
}

// 更新仪表盘进度条
function updateDashboardProgress() {
    var done = Object.values(subStatuses).filter(function(s) { return s === 'completed'; }).length;
    var inProgress = Object.values(subStatuses).filter(function(s) { return s === 'in_progress'; }).length;
    var total = subtasks.length;
    var pct = total > 0 ? Math.round((done / total) * 100) : 0;

    // Step label
    var stepEl = document.getElementById('dash-step-label');
    if (stepEl) stepEl.innerText = 'Step ' + (currentSubtaskIdx + 1);

    // Task name
    var nameEl = document.getElementById('dash-task-name');
    if (nameEl && subtasks[currentSubtaskIdx]) {
        nameEl.innerText = subtasks[currentSubtaskIdx].name;
    }

    // Progress bar blocks
    var bar = document.getElementById('dash-progress-bar');
    if (bar && total > 0) {
        var html = '';
        for (var i = 0; i < total; i++) {
            var sid = subtasks[i].id;
            var status = subStatuses[sid] || 'pending';
            if (status === 'completed') {
                html += '<div class="flex-1 bg-green-500 rounded-full"></div>';
            } else if (status === 'in_progress') {
                html += '<div class="flex-1 bg-indigo-500 rounded-full animate-pulse"></div>';
            } else {
                html += '<div class="flex-1 bg-slate-200 rounded-full"></div>';
            }
        }
        bar.innerHTML = html;
    }

    // Percentage
    var pctEl = document.getElementById('dash-progress-pct');
    if (pctEl) pctEl.innerText = pct + '%';
}

                subtaskList += marker + ' ' + s.name + '\n';
            });
            var progressLine = '▮'.repeat(doneCount) + '▯'.repeat(totalCount - doneCount) + '[' + doneCount + '/' + totalCount + ']';
            var wd = '/home/learner/datatutor/student_' + (window._datatutor_userId || 1) + '_vm0';
            var fixPath = function(s) { return (s||'').replace(/\/opt\b/g, wd).replace(/\/opt\//g, wd+'/'); };
            var sysContent = SYSTEM_PROMPT_BASE
                + '\n所有子任务：\n' + subtaskList.trim()

function buildSidebar() {

    var html = '';
    subtasks.forEach(function(st, i) {

        var done = status === 'completed';

                   : done ? 'text-slate-400 hover:text-slate-200'

                 : status === 'in_progress' ? 'lucide:loader'

                      : status === 'in_progress' ? 'text-indigo-400'

function updateProgress() {
    var done = Object.values(subStatuses).filter(function(s) { return s === 'completed'; }).length;
    var total = subtasks.length;
    var pct = total > 0 ? Math.round((done / total) * 100) : 0;
    var el1 = document.getElementById('progress-percent');
    var el2 = document.getElementById('progress-text');
    var circ = document.getElementById('progress-circle');
    var cnt = document.getElementById('progress-task-count');
    if (el1) el1.innerText = pct + '%';
    if (el2) el2.innerText = pct + '%';
    if (cnt) cnt.innerText = '任务 ' + done + ' / ' + total;
    if (circ) {
        var circum = 125.6;
        var offset = circum * (1 - pct / 100);
        circ.setAttribute('stroke-dashoffset', offset);
    }
    updateDashboardProgress();
    tickTrainingHours();
    // 全部完成：显示生成报告按钮
    var reportBtn = document.getElementById('generate-report-btn');
    var reportBanner = document.getElementById('report-banner');
    if (done > 0 && done === total) {
        if (!reportBtn) {
            var container = document.getElementById('chat-messages');
            if (container) {
                var div = document.createElement('div');
                div.className = 'text-center py-4';
                div.innerHTML = '<button id="generate-report-btn" class="bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-emerald-600 flex items-center gap-2 mx-auto shadow-lg shadow-emerald-500/30 animate-pulse" onclick="generateReport()"><iconify-icon icon="lucide:award"></iconify-icon> 完成全部任务，生成实训报告</button>';
                container.appendChild(div);
            }
        }
        if (reportBanner) reportBanner.classList.remove('hidden');
    } else {
        if (reportBtn) reportBtn.remove();
        if (reportBanner) reportBanner.classList.add('hidden');
    }
}

async function switchSubtask(idx) {
    currentSubtaskIdx = idx;
    // 恢复完成按钮
    var btn = document.getElementById('complete-btn');
    if (btn) btn.style.display = '';
    knowledgeInited = false;  // 切换子任务时重置知识面板记忆体
    knowledgeHistory = [];
    var km = document.getElementById('knowledge-messages');
    if (km) km.innerHTML = '';  // 清空旧消息
    buildSidebar();
    updateProgress();
    // 切换子任务时重置耗时起点
    sessionStartTime = Date.now();
    localStorage.setItem('dt_session_start', sessionStartTime);

    var st = subtasks[idx];
    if (!st) return;
    var container = document.getElementById('chat-messages');
    container.innerHTML = '';

    // 从后端加载历史（重置记忆体防止重复）
    if (taskHistories[st.id] && taskHistories[st.id].length > 0 && taskHistories[st.id][0].role === 'system') {
        taskHistories[st.id] = [taskHistories[st.id][0]];  // 只保留 system prompt
    } else {
        taskHistories[st.id] = [];
    }
    try {
        var hist = await API.getChatHistory(st.id);
        if (hist && hist.messages) {
            hist.messages.forEach(function(m) {
                if (m.role === 'system') return;
                appendChatEl(m.role, m.content);
            });
            if (!taskHistories[st.id]) taskHistories[st.id] = [];
            hist.messages.forEach(function(m) {
                taskHistories[st.id].push(m);
            });
        }
    } catch(e) { /* 历史不可用 */ }

    if (!taskHistories[st.id] || taskHistories[st.id].length === 0) {
        // 构建完整子任务列表
        var subtaskList = '';
        var doneCount = 0;
        subtasks.forEach(function(s, i) {
            var status = subStatuses[s.id];
            var done = (status === 'completed');
            if (done) doneCount++;
            var marker = done ? '▮' : '▯';
            subtaskList += marker + ' ' + s.name + '\n';
        });
        var totalCount = subtasks.length;
        var progressLine = '▮'.repeat(doneCount) + '▯'.repeat(totalCount - doneCount) + '[' + doneCount + '/' + totalCount + ']';
        var fullSubtaskInfo = '所有子任务：\n' + subtaskList.trim()
            + '\n进度：' + progressLine
            + '\n当前子任务：' + st.name
            + '\n操作指令：' + (st.command || '')
            + '\n预期产出：' + (st.expected_output || '')
            + '\n知识点：' + (st.knowledge_text || '');
        taskHistories[st.id] = [{ role: 'system', content: SYSTEM_PROMPT_BASE + fullSubtaskInfo }];
    }

    // 主动输出任务蓝图
    showTaskBlueprint(st);
}

// 生成并展示任务全景蓝图
function showTaskBlueprint(st) {
    var done = Object.values(subStatuses).filter(function(s) { return s === 'completed'; }).length;
    var total = subtasks.length;
    var blocks = '';
    for (var i = 0; i < total; i++) {
        var sid = subtasks[i].id;
        blocks += (subStatuses[sid] === 'completed') ? '▮' : '▯';
    }

    var stepNames = subtasks.map(function(s) { return s.name; }).join(' → ');
    var blueprint = blocks + '[' + done + '/' + total + '] ' + stepNames
        + '\n\n**当前子任务：' + st.name + '**'
        + (st.command ? '\n\n操作指令：\n`' + st.command + '`' : '')
        + (st.expected_output ? '\n\n预期产出：' + st.expected_output : '');

    // 只在首次进入时显示蓝图（没有历史消息时）
    var container = document.getElementById('chat-messages');
    if (container && container.children.length === 0) {
        appendChatEl('ai', blueprint);
    }
}

function htmlEscape(str) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
}

// ============================================================
// AI 对话
// ============================================================
function appendChatEl(role, content) {
    var container = document.getElementById('chat-messages');
    var div = document.createElement('div');
    if (role === 'user') {
        div.className = 'flex gap-4 flex-row-reverse';
        div.innerHTML = '<div class="w-8 h-8 rounded-lg bg-slate-200 flex-none flex items-center justify-center text-slate-600"><iconify-icon icon="lucide:user"></iconify-icon></div><div class="flex-1 flex flex-col items-end"><div class="chat-bubble-user bg-indigo-600 p-3 text-sm text-white leading-relaxed max-w-[90%]">'+htmlEscape(content)+'</div></div>';
    } else {
        div.className = 'flex gap-4';
        var html = (typeof marked !== 'undefined' && marked.parse) ? marked.parse(content) : htmlEscape(content);
        div.innerHTML = '<div class="w-8 h-8 rounded-lg bg-indigo-600 flex-none flex items-center justify-center text-white"><iconify-icon icon="lucide:bot"></iconify-icon></div><div class="flex-1"><div class="chat-bubble-ai bg-slate-100 p-3 text-sm text-slate-700 leading-relaxed max-w-[90%] whitespace-pre-wrap">'+html+'</div></div>';
    }
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function sendChatMessage() {
    var input = document.getElementById('chat-input');
    var msg = input.value.trim();
    if (!msg) return;
    input.value = ''; input.style.height = 'auto';

    var st = subtasks[currentSubtaskIdx];
    if (!st) return;

    appendChatEl('user', msg);
    if (!taskHistories[st.id]) taskHistories[st.id] = [];
    taskHistories[st.id].push({ role: 'user', content: msg });
    API.saveChatMessage(st.id, 'user', msg).catch(function(){});

    var btn = document.getElementById('chat-send-btn');
    btn.disabled = true;
    btn.innerHTML = '<iconify-icon icon="lucide:loader" class="animate-spin text-lg"></iconify-icon>';

    API.aiChat(taskHistories[st.id].slice(-20), courseId).then(function(data) {
        var reply = data.reply || '模型未响应';
        // 去掉 AI 可能输出的完成标记（不再自动完成，由按钮控制）
        reply = reply.replace(/\[SUBTASK_COMPLETE\]/g, '');
        taskHistories[st.id].push({ role: 'assistant', content: reply });
        appendChatEl('ai', reply);
        API.saveChatMessage(st.id, 'assistant', reply).catch(function(){});
    }).catch(function(e) {
        appendChatEl('ai', '⚠️ 请求失败：' + e.message);
    }).finally(function() {
        btn.disabled = false;
        btn.innerHTML = '<iconify-icon class="text-lg" icon="lucide:send"></iconify-icon>';
    });
}

async function completeAndNext(btn) {
    var st = subtasks[currentSubtaskIdx];
    if (!st) return;

    btn.disabled = true;
    btn.querySelector('iconify-icon').setAttribute('icon', 'lucide:loader');
    btn.querySelector('iconify-icon').classList.add('animate-spin');

    var resetBtn = function() {
        btn.disabled = false;
        btn.querySelector('iconify-icon').setAttribute('icon', 'lucide:check-circle');
        btn.querySelector('iconify-icon').classList.remove('animate-spin');
    };

    try {
        // 标记当前子任务完成
        await API.completeSubtask(st.id);
        subStatuses[st.id] = 'completed';

        var nextIdx = currentSubtaskIdx + 1;
        if (nextIdx < subtasks.length) {
            // 有下一个子任务 → 跳转并标记为进行中
            var nextSt = subtasks[nextIdx];
            await API.startSubtask(nextSt.id);
            subStatuses[nextSt.id] = 'in_progress';
            switchSubtask(nextIdx);
            resetBtn();
        } else {
            // 所有子任务完成
            buildSidebar();
            updateProgress();
            var container = document.getElementById('chat-messages');
            container.innerHTML = '<div class="text-center py-12"><div class="text-4xl mb-3">🎉</div><p class="text-slate-600 font-semibold">恭喜！所有子任务已完成！</p><p class="text-xs text-slate-400 mt-1">可以在左侧选择任务复习或返回课程列表</p></div>';
            btn.style.display = 'none';
        }
    } catch (e) {
        // 恢复按钮
        resetBtn();
        console.error('操作失败:', e);
    }
}

document.getElementById('term-conn-status').textContent=d.message||'已连接';

renderTermTabs()});

else{var et=extraTerms.find(function(t){return t.id===sid;});if(et){et.connected=false;if(et.term)et.term.write('\r\n\x1b[31m'+(d.message||'连接失败')+'\x1b[0m\r\n')}}

b.innerHTML='<iconify-icon icon="lucide:plug-zap"></iconify-icon> 连接终端';
document.getElementById('vm-connect-msg').textContent=d.message||'连接失败';
document.getElementById('vm-connect-msg').className='text-[10px] text-red-400 text-center';
renderTermTabs()});
termSocket.on('terminal_disconnected',function(d){
var sid=parseInt(d.session_id)||0;
if(sid===0){if(term)term.write('\r\n\x1b[33m终端已断开\x1b[0m\r\n');vmConnected=false}

document.getElementById('vm-connect-form').classList.remove('hidden');
renderTermTabs()});
return true}
function loadVMCreds(){var h=document.getElementById('vm-host');var u=document.getElementById('vm-user');var p=document.getElementById('vm-password');if(h)h.value=localStorage.getItem('dt_vm_host')||'';if(u)u.value=localStorage.getItem('dt_vm_user')||'';if(p)p.value=localStorage.getItem('dt_vm_pass')||''}
function connectVM(){var host=document.getElementById('vm-host').value.trim();var user=document.getElementById('vm-user').value.trim();var pwd=document.getElementById('vm-password').value;var msg=document.getElementById('vm-connect-msg');var btn=document.getElementById('vm-connect-btn');var userInfo=API.getCurrentUser()||{};var isStudent=userInfo.role==='student';if(!host&&!isStudent&&!user){msg.textContent='请填写完整的连接信息';msg.className='text-[10px] text-red-400 text-center';return}if(!isStudent){localStorage.setItem('dt_vm_host',host);localStorage.setItem('dt_vm_user',user);localStorage.setItem('dt_vm_pass',pwd)}btn.disabled=true;btn.innerHTML='<iconify-icon icon="lucide:loader-2" class="animate-spin"></iconify-icon> 连接中...';msg.textContent='';msg.className='text-[10px] text-slate-500 text-center';setupTermSocket();var uid=userInfo.id||1;termSocket.emit('terminal_connect',{student_id:uid,session_id:0,host:isStudent?'':host,user:isStudent?'':user,password:isStudent?'':pwd});clearTimeout(window._vmTimeout);window._vmTimeout=setTimeout(function(){if(!vmConnected&&btn.disabled){btn.disabled=false;btn.innerHTML='<iconify-icon icon="lucide:plug-zap"></iconify-icon> 连接终端';msg.textContent='连接超时，请检查 VM 地址和端口是否可达';msg.className='text-[10px] text-red-400 text-center'}},15000)}
function copyTermText(){if(term){var s=term.getSelection();if(s)navigator.clipboard.writeText(s).catch(function(){})}}
function initTerminal(){if(typeof Terminal==='undefined')return;var c=document.getElementById('terminal-container');if(!c)return;term=new Terminal({cursorBlink:true,fontSize:14,fontFamily:"'JetBrains Mono','Cascadia Code',monospace",theme:{background:'#0D1117',foreground:'#E6EDF3',cursor:'#4F46E5',selectionBackground:'#264f78',black:'#484F58',red:'#FF7B72',green:'#3FB950',yellow:'#D29922',blue:'#58A6FF',magenta:'#BC8CFF',cyan:'#39C5CF',white:'#B1BAC4'}});if(typeof FitAddon!=='undefined'){fitAddon=new FitAddon.FitAddon();term.loadAddon(fitAddon)}if(typeof WebLinksAddon!=='undefined'){term.loadAddon(new WebLinksAddon.WebLinksAddon())}term.open(c);if(fitAddon){fitAddon.fit();window.addEventListener('resize',function(){fitAddon.fit()})}loadVMCreds();setupTermSocket();var userInfo=API.getCurrentUser()||{};var uid=userInfo.id||1;term.onData(function(d){if(termSocket)termSocket.emit('terminal_input',{student_id:uid,session_id:0,command:d})});term.onResize(function(s){if(termSocket)termSocket.emit('terminal_resize',{student_id:uid,session_id:0,cols:s.cols,rows:s.rows})});if(userInfo.role==='student'){document.getElementById('vm-connect-form').classList.add('hidden');connectVM()}}
setTimeout(initTerminal,800);

// —— 多 VM 终端（增量） ——
var extraTerms = [];  // [{id, name, host, user, pass, term, fit, connected, el}]
var activeTermIdx = 0;
var nextTermId = 1;

function renderTermTabs() {
    var nameEl = document.getElementById('term-tab-name');
    var current = activeTermIdx === 0 ? 'bash — 实训终端 ▾' : ((extraTerms[activeTermIdx - 1] || {}).name || 'VM') + ' ▾';
    if (nameEl) nameEl.innerText = current;
    // 渲染下拉列表
    var dd = document.getElementById('term-dropdown');
    if (!dd) return;
    var html = '';
    // 主终端
    var active0 = activeTermIdx === 0 ? 'bg-slate-700 text-white' : 'text-slate-300 hover:bg-slate-700';
    html += '<div class="flex items-center justify-between px-3 py-1.5 text-xs cursor-pointer ' + active0 + '" onclick="switchToTerm(0);toggleTermList()">'
        + '<span><span class="w-1.5 h-1.5 rounded-full inline-block mr-1.5 ' + (vmConnected ? 'bg-green-400' : 'bg-slate-500') + '"></span>主终端 — bash</span>'
        + '</div>';
    // 额外 VM
    extraTerms.forEach(function(t, i) {
        var idx = i + 1;
        var active = activeTermIdx === idx ? 'bg-slate-700 text-white' : 'text-slate-300 hover:bg-slate-700';
        html += '<div class="flex items-center justify-between px-3 py-1.5 text-xs cursor-pointer ' + active + '" onclick="switchToTerm(' + idx + ');toggleTermList()">'
            + '<span><span class="w-1.5 h-1.5 rounded-full inline-block mr-1.5 ' + (t.connected ? 'bg-green-400' : 'bg-slate-500') + '"></span>' + t.name + '</span>'
            + '<button class="text-slate-500 hover:text-red-400" onclick="event.stopPropagation();closeTermTab(' + idx + ')" title="关闭">'
            + '<iconify-icon icon="lucide:x" class="text-[10px]"></iconify-icon></button>'
            + '</div>';
    });
    dd.innerHTML = html;
}

function toggleTermList(e) {
    if (e) e.stopPropagation();
    var dd = document.getElementById('term-dropdown');
    if (!dd) return;
    dd.classList.toggle('hidden');
}

// 点击空白关闭下拉
document.addEventListener('click', function(e) {
    var dd = document.getElementById('term-dropdown');
    var label = document.getElementById('term-tab-label');
    if (dd && !dd.classList.contains('hidden') && !label.contains(e.target)) {
        dd.classList.add('hidden');
    }
});

function addVMTerm() {
    var id = nextTermId++;
    var name = 'VM-' + id;
    var t = { id: id, name: name, host: '', user: 'root', pass: '', term: null, fit: null, connected: false, el: null };
    extraTerms.push(t);

    var wrap = document.getElementById('terminal-container').parentNode;
    var box = document.createElement('div');
    box.className = 'h-full';
    box.style.display = 'none';
    box.id = 'extra-term-' + id;
    wrap.appendChild(box);
    t.el = box;

    switchToTerm(extraTerms.length); // 切到新 tab
    document.getElementById('term-dropdown').classList.add('hidden'); // 关下拉
}

function switchToTerm(idx) {
    if (activeTermIdx === 0) {
        document.getElementById('terminal-container').style.display = 'none';
    } else {
        var ct = extraTerms[activeTermIdx - 1];
        if (ct && ct.el) ct.el.style.display = 'none';
    }
    activeTermIdx = idx;
    if (idx === 0) {
        document.getElementById('terminal-container').style.display = '';
    } else {
        var t = extraTerms[idx - 1];
        if (t && t.el) t.el.style.display = '';
    }
    renderTermTabs();
    // 重置连接表单
    var btn = document.getElementById('vm-connect-btn');
    if (btn) { btn.disabled = false; btn.innerHTML = '<iconify-icon icon="lucide:plug-zap"></iconify-icon> 连接终端'; }
    document.getElementById('vm-connect-msg').textContent = '';
    document.getElementById('vm-connect-msg').className = 'text-[10px] text-slate-600 text-center';
    if (idx > 0) {
        var t = extraTerms[idx - 1];
        if (t && !t.connected) {
            document.getElementById('vm-connect-form').classList.remove('hidden');
            document.getElementById('vm-host').value = t.host || '';
            document.getElementById('vm-user').value = t.user || 'root';
            document.getElementById('vm-password').value = t.pass || '';
        }
    } else if (!vmConnected) {
        document.getElementById('vm-connect-form').classList.remove('hidden');
    }
}

function closeTermTab(idx) {
    if (idx === 0) return; // 不能关主终端
    var t = extraTerms[idx - 1];
    if (!t) return;
    if (t.connected && termSocket) {
        termSocket.emit('terminal_disconnect', { student_id: getUserId(), session_id: t.id });
    }
    if (t.term) t.term.dispose();
    if (t.el) t.el.remove();
    extraTerms.splice(idx - 1, 1);
    if (activeTermIdx >= idx) activeTermIdx = Math.max(0, activeTermIdx - 1);
    switchToTerm(activeTermIdx);
    renderTermTabs();
}

// 重写 connectVM 以支持多 tab
var _origConnectVM = connectVM;
connectVM = function() {
    if (activeTermIdx === 0) {
        return _origConnectVM();
    }
    // 连接额外 VM
    var t = extraTerms[activeTermIdx - 1];
    if (!t) return;
    t.host = document.getElementById('vm-host').value.trim();
    t.user = document.getElementById('vm-user').value.trim();
    t.pass = document.getElementById('vm-password').value;
    if (!t.host || !t.pass) {
        document.getElementById('vm-connect-msg').textContent = '请填写完整信息';
        document.getElementById('vm-connect-msg').className = 'text-[10px] text-red-400 text-center';
        return;
    }
    var btn = document.getElementById('vm-connect-btn');
    btn.disabled = true;
    btn.innerHTML = '<iconify-icon icon="lucide:loader-2" class="animate-spin"></iconify-icon> 连接中...';

    if (!termSocket) setupTermSocket();

    // 创建 xterm
    if (t.term) t.term.dispose();
    t.term = new Terminal({
        cursorBlink: true, fontSize: 14,
        fontFamily: "'JetBrains Mono','Cascadia Code',monospace",
        theme: { background: '#0D1117', foreground: '#E6EDF3', cursor: '#4F46E5',
                 selectionBackground: '#264f78', black: '#484F58', red: '#FF7B72',
                 green: '#3FB950', yellow: '#D29922', blue: '#58A6FF', magenta: '#BC8CFF',
                 cyan: '#39C5CF', white: '#B1BAC4' }
    });
    if (typeof FitAddon !== 'undefined') {
        t.fit = new FitAddon.FitAddon();
        t.term.loadAddon(t.fit);
    }
    t.term.open(t.el);
    if (t.fit) t.fit.fit();

    var uid = (API.getCurrentUser() || {}).id || 1;
    t.term.onData(function(d) {
        if (termSocket) termSocket.emit('terminal_input', { student_id: uid, session_id: t.id, command: d });
    });
    t.term.onResize(function(s) {
        if (termSocket) termSocket.emit('terminal_resize', { student_id: uid, session_id: t.id, cols: s.cols, rows: s.rows });
    });

    termSocket.emit('terminal_connect', {
        student_id: uid, session_id: t.id,
        host: t.host, user: t.user, password: t.pass
    });
};
</script>


<!-- 知识面板脚本 -->
<script>
// 侧边栏折叠
function toggleCollapse(id) {
    var content = document.getElementById(id);
    var icon = document.getElementById('icon-' + id);
    if (content) content.classList.toggle('active');
    if (icon) icon.classList.toggle('active');
}

// === 知识面板（使用 API.aiKnowledge 代理 + 持久化） ===
var knowledgeHistory = [];
var knowledgeInited = false;

function toggleKnowledge(show) {
    var panel = document.getElementById('knowledge-panel');
    if (!panel) return;
    if (show) {
        panel.classList.add('active');
        if (!knowledgeInited) {
            knowledgeInited = true;
            var st = subtasks[currentSubtaskIdx];
            var sysContent = '你是DataTutor的知识答疑助手。学生正在实训中。当前子任务：' + (st ? st.name : '')
                + '。知识点背景：' + ((st && st.knowledge_text) || (st ? st.command : '') || '无预设内容，请基于当前操作回答。')
                + ' 请简洁回答，每条回复≤200字。';
            knowledgeHistory = [{ role: 'system', content: sysContent }];
            appendKnMsg('ai', (st && st.knowledge_text) || '我是知识答疑助手，对当前子任务有任何不清楚的地方，随时问我。');
        }
    } else {
        panel.classList.remove('active');
    }
}

function appendKnMsg(role, content, isTemp) {
    var container = document.getElementById('knowledge-messages');
    if (!container) return '';
    var div = document.createElement('div');
    var id = 'kn-msg-' + Date.now();
    div.id = id;
    if (role === 'user') {
        div.className = 'flex gap-3 flex-row-reverse';
        div.innerHTML = '<div class="w-7 h-7 rounded-lg bg-slate-200 flex-none flex items-center justify-center text-slate-600"><iconify-icon icon="lucide:user" class="text-xs"></iconify-icon></div><div class="flex-1 flex flex-col items-end"><div class="bg-indigo-600 text-white rounded-xl p-3 text-sm max-w-[90%]">'+htmlEscape(content)+'</div></div>';
    } else {
        div.className = 'flex gap-3';
        div.innerHTML = '<div class="w-7 h-7 rounded-lg bg-indigo-600 flex-none flex items-center justify-center text-white"><iconify-icon icon="lucide:bot" class="text-xs"></iconify-icon></div><div class="flex-1"><div class="bg-slate-100 rounded-xl p-3 text-sm text-slate-700 leading-relaxed max-w-[90%] whitespace-pre-wrap">'+htmlEscape(content)+'</div></div>';
    }
    if (isTemp) div.classList.add('animate-pulse');
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return id;
}

function updateKnMsg(id, content) {
    var div = document.getElementById(id);
    if (!div) return;
    div.classList.remove('animate-pulse');
    var bubble = div.querySelector('.bg-slate-100');
    if (bubble) bubble.textContent = content;
}

function askKnowledge() {
    var input = document.getElementById('knowledge-input');
    if (!input) return;
    var msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    input.style.height = 'auto';
    appendKnMsg('user', msg);
    knowledgeHistory.push({ role: 'user', content: msg });

    var st = subtasks[currentSubtaskIdx];
    if (st) API.saveKnowledgeChat(st.id, 'user', msg).catch(function(){});

    var btn = document.getElementById('kn-btn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<iconify-icon icon="lucide:loader" class="animate-spin text-lg"></iconify-icon>'; }
    var loadId = appendKnMsg('ai', '思考中...', true);

    API.aiKnowledge(knowledgeHistory.slice(-10)).then(function(data) {
        var reply = data.reply || '暂时无法回答，请重试。';
        updateKnMsg(loadId, reply);
        knowledgeHistory.push({ role: 'assistant', content: reply });
        if (st) API.saveKnowledgeChat(st.id, 'assistant', reply).catch(function(){});
    }).catch(function(e) {
        updateKnMsg(loadId, '请求失败：' + e.message);
    }).finally(function() {
        if (btn) { btn.disabled = false; btn.innerHTML = '<iconify-icon class="text-lg" icon="lucide:send"></iconify-icon>'; }
    });
}

function quickAsk(msg) {
    var input = document.getElementById('knowledge-input');
    if (input) { input.value = msg; askKnowledge(); }
}

// 知识面板 Enter 发送
(function() {
    var knInput = document.getElementById('knowledge-input');
    if (knInput) {
        knInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askKnowledge(); }
        });
    }
})();

// === 拖拽分隔条 ===
(function() {
    var handle = document.getElementById('resize-handle');
    var chatPanel = document.getElementById('chat-panel');
    var terminalPanel = document.getElementById('terminal-panel');
    if (!handle || !chatPanel || !terminalPanel) return;
    var parent = chatPanel.parentElement;
    var isResizing = false;

    handle.addEventListener('mousedown', function(e) {
        isResizing = true;
        handle.classList.add('active');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
        if (!isResizing) return;
        var rect = parent.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var handleW = handle.offsetWidth;
        var minW = 200;
        var maxW = rect.width - handleW - minW;
        var leftW = Math.max(minW, Math.min(maxW, x));
        chatPanel.style.flex = '0 0 ' + leftW + 'px';
        terminalPanel.style.flex = '1 1 auto';
        chatPanel.style.width = leftW + 'px';
    });

    document.addEventListener('mouseup', function() {
        if (!isResizing) return;
        isResizing = false;
        handle.classList.remove('active');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    });
})();
// === 清空聊天 ===
function clearCurrentChat() {
    if (!confirm('确定清空当前子任务聊天记录？')) return;
    var st = subtasks[currentSubtaskIdx];
    if (st) {
        // 保留系统消息
        var sysMsg = taskHistories[st.id] && taskHistories[st.id][0];
        taskHistories[st.id] = sysMsg ? [sysMsg] : [];
    }
    document.getElementById('chat-messages').innerHTML = '';
}
// === 生成实训报告 ===
// 成员D：Celery 异步报告生成（WebSocket 进度 + 轮询兜底）
var reportTaskId = null;
var reportPollTimer = null;
var REPORT_STAGE_TEXT = {
    started: 'AI 正在生成实训报告...',
    collecting: '正在收集实训数据...',
    generating: 'AI 正在撰写报告，约需 10-30 秒...',
    saving: '报告生成完成，正在保存...',
    completed: '报告已生成',
    failed: '生成失败'
};
async function generateReport() {
    var modal = document.getElementById('report-modal');
    var content = document.getElementById('report-content');
    modal.classList.remove('hidden');
    renderReportLoading('AI 正在生成实训报告，约需 10-30 秒...');
    try {
        var data = await API.generateReportAsync(courseId);
        if (data.content) {
            content.innerHTML = '<div class=\"text-sm text-slate-300 leading-relaxed prose prose-invert max-w-none\">' + marked.parse(data.content) + '</div>';
        }
    } catch(e) {
        content.innerHTML = '<div class=\"text-red-400 text-sm text-center\">生成失败: ' + e.message + '</div>';
    }
}
function renderReportLoading(message) {
    var content = document.getElementById('report-content');
    content.innerHTML = '<div class="text-center py-12"><iconify-icon icon="lucide:loader" class="animate-spin text-3xl text-emerald-400"></iconify-icon><p class="text-slate-500 mt-3">' + (message || '报告生成已加入队列...') + '</p></div>';
}
function startReportPolling() {
    if (reportPollTimer) clearInterval(reportPollTimer);
    reportPollTimer = setInterval(function() {
        if (!reportTaskId) { clearInterval(reportPollTimer); return; }
        API.getTaskStatus(reportTaskId).then(function(t) {
            if (t.state === 'SUCCESS') {
                clearInterval(reportPollTimer);
                document.getElementById('report-content').innerHTML = '<div class="text-sm text-slate-300 leading-relaxed prose prose-invert max-w-none">' + marked.parse(t.data.content) + '</div>';
            } else if (t.state === 'FAILURE') {
                clearInterval(reportPollTimer);
                document.getElementById('report-content').innerHTML = '<div class="text-red-400 text-sm text-center">生成失败</div>';
            }
        }).catch(function(){});
    }, 2000);
}
// SocketIO 进度监听
if (termSocket && typeof termSocket.on === 'function') {
    termSocket.on('report_progress', function(p) {
        var stage = p.stage || 'started';
        if (stage === 'completed' && p.report) {
            clearInterval(reportPollTimer);
            document.getElementById('report-content').innerHTML = '<div class="text-sm text-slate-300 leading-relaxed prose prose-invert max-w-none">' + marked.parse(p.report) + '</div>';
        } else {
            renderReportLoading(REPORT_STAGE_TEXT[stage] || stage);
        }
    });
}
function closeReportModal() { document.getElementById('report-modal').classList.add('hidden'); }
</script>

<!-- 报告弹窗 -->
<div class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm p-6" id="report-modal" onclick="closeReportModal()">
    <div class="bg-[#1A1535] rounded-2xl border border-white/10 w-full max-w-3xl max-h-[80vh] flex flex-col shadow-2xl" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between p-5 border-b border-white/10 flex-none">
            <div class="flex items-center gap-2">
                <iconify-icon class="text-emerald-400" icon="lucide:award"></iconify-icon>
                <span class="text-sm font-semibold">实训报告</span>
            </div>
            <button class="text-slate-500 hover:text-white" onclick="closeReportModal()"><iconify-icon class="text-xl" icon="lucide:x"></iconify-icon></button>
        </div>
        <div class="flex-1 overflow-y-auto p-6" id="report-content"></div>
    </div>
