<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理员 - DataTutor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<script src="/static/js/api.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc}
.card{background:#fff;border-radius:16px;border:1px solid #e2e8f0}
</style>
</head>
<body class="h-screen flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-white border-r border-slate-200 flex flex-col h-full">
  <div class="p-5 border-b"><div class="font-bold text-slate-800">DataTutor</div><div class="text-xs text-slate-400">管理员面板</div></div>
  <div class="flex-1 overflow-y-auto p-4">
    <h3 class="text-xs font-bold text-slate-400 uppercase mb-3">消息预览</h3>
    <div id="pending-list" class="space-y-2"></div>
  </div>
  <div class="p-4 border-t"><div class="text-sm font-medium" id="user-name"></div><button class="text-xs text-red-500 mt-1" onclick="localStorage.clear();location.href='/'">退出</button></div>
</aside>

<!-- MAIN -->
<main class="flex-1 flex flex-col">
  <div class="bg-white border-b px-6 py-3 flex gap-4">
    <button class="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white" id="btn-courses" onclick="switchTab('courses')">课程管理</button>
    <button class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-500" id="btn-teachers" onclick="switchTab('teachers')">教师管理</button>
  </div>
  <div class="flex-1 overflow-y-auto">
    <!-- Courses Tab -->
    <div id="tab-courses" class="p-6">
      <div class="flex gap-3 mb-6">
        <button class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold" onclick="showCreateCourse()">+ 创建课程</button>
        <button class="px-4 py-2 bg-violet-600 text-white rounded-xl text-sm font-semibold" onclick="showAiGenerate()"><iconify-icon icon="lucide:sparkles" class="mr-1 align-middle"></iconify-icon>AI 生成课程</button>
      </div>
      <div id="courses-grid" class="grid grid-cols-3 gap-4"></div>
    </div>
    <!-- Teachers Tab -->
    <div id="tab-teachers" class="p-6 hidden">
      <input class="w-64 px-4 py-2 border rounded-xl text-sm mb-4" placeholder="搜索工号..." id="teacher-search" oninput="loadTeachers()">
      <div id="teacher-list"></div>
    </div>
  </div>
</main>

<!-- Course Create Modal -->

  </div>
</div>

<!-- AI Generate Modal -->

  </div>
</div>

<!-- Pending Detail Modal -->
<div class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40" id="modal-detail" onclick="document.getElementById('modal-detail').classList.add('hidden')">
  <div class="card w-full max-w-lg shadow-2xl" onclick="event.stopPropagation()">
    <div class="px-6 py-4 border-b flex justify-between"><h3 class="font-bold" id="detail-name"></h3><button onclick="document.getElementById('modal-detail').classList.add('hidden')"><iconify-icon icon="lucide:x" class="text-xl"></iconify-icon></button></div>
    <div class="p-6"><p class="text-xs text-slate-400 mb-3" id="detail-info"></p><p class="text-sm text-slate-600" id="detail-desc"></p></div>
    <div class="px-6 py-4 border-t flex gap-3 justify-end"><button class="px-4 py-2 bg-red-100 text-red-600 rounded-lg text-sm" onclick="audit(0)">驳回</button><button class="px-4 py-2 bg-emerald-500 text-white rounded-lg text-sm" onclick="audit(1)">通过</button></div>
  </div>
</div>

<script>
var u=API.getCurrentUser();document.getElementById('user-name').innerText=(u||{}).display_name||'admin';
loadPending();loadCourses();

function switchTab(t){
  document.getElementById('tab-courses').classList.toggle('hidden',t!=='courses');
  document.getElementById('tab-teachers').classList.toggle('hidden',t!=='teachers');
  document.getElementById('btn-courses').className='px-4 py-2 rounded-xl text-sm font-semibold '+(t==='courses'?'bg-indigo-600 text-white':'text-slate-500');
  document.getElementById('btn-teachers').className='px-4 py-2 rounded-xl text-sm font-semibold '+(t==='teachers'?'bg-indigo-600 text-white':'text-slate-500');
  if(t==='teachers')loadTeachers();
}

// === PENDING ===
var pc={};
async function loadPending(){
  try{var r=await apiFetch('/courses/admin/pending');var cs=Array.isArray(r)?r:(r.courses||[]);
    var el=document.getElementById('pending-list');
    if(!cs.length){el.innerHTML='<p class="text-xs text-slate-400">暂无待审核</p>';return}
    // 展示申请教师姓名 + 工号
    var h='';cs.forEach(function(c){h+='<div class="p-2 rounded-lg cursor-pointer hover:bg-red-50 text-sm" onclick="showDetail('+c.id+')"><div class="font-medium truncate">'+c.name+'</div><div class="text-xs text-slate-400">'+(c.teacher_name||'')+(c.teacher_no?' · 工号'+c.teacher_no:'')+'</div></div>'});
    el.innerHTML=h;
  }catch(e){}
}
var _dc={};
async function showDetail(cid){
  if(!_dc[cid]){var r=await apiFetch('/courses/admin/pending');(Array.isArray(r)?r:(r.courses||[])).forEach(function(c){_dc[c.id]=c});}
  var c=_dc[cid];if(!c)return;
  document.getElementById('detail-name').innerText=c.name;
  document.getElementById('detail-info').innerText=(c.course_code||'')+' | '+(c.teacher_name||'')+(c.teacher_no?'（工号'+c.teacher_no+'）':'')+' | '+c.subtask_count+'子任务';
  document.getElementById('detail-desc').innerText=c.description||'';
  document.getElementById('modal-detail').classList.remove('hidden');window._ac=cid;
}
async function audit(a){
  var cid=window._ac;if(!cid)return;
  await apiFetch((a?'/courses/admin/approve/':'/courses/admin/reject/')+cid,{method:'POST'});
  toast(a?'已通过审核，课程已全站公开':'已驳回公开申请','success');
  document.getElementById('modal-detail').classList.add('hidden');
  _dc={};loadPending();loadCourses();
}

// === COURSES ===
var colors=['from-indigo-500 to-blue-600','from-violet-500 to-purple-600','from-emerald-500 to-teal-600','from-amber-500 to-orange-600','from-rose-500 to-pink-600','from-cyan-500 to-sky-600'];
async function loadCourses(){
  try{var r=await apiFetch('/courses');var cs=Array.isArray(r)?r:(r.courses||[]);
    var cols=['from-indigo-500 to-blue-600','from-violet-500 to-purple-600','from-emerald-500 to-teal-600','from-amber-500 to-orange-600','from-rose-500 to-pink-600','from-cyan-500 to-sky-600'];
    var h='';cs.forEach(function(c,i){
      var col=cols[i%cols.length];
      h+='<div class="card p-6 cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all duration-300" data-cid="'+c.id+'" data-cname="'+c.name.replace(/"/g,'quot;')+'"><div class="w-12 h-12 bg-gradient-to-br '+col+' rounded-xl flex items-center justify-center mb-3"><iconify-icon icon="lucide:book-open" class="text-white text-xl"></iconify-icon></div><div class="font-semibold text-sm text-slate-800 mb-1">'+c.name+'</div><div class="text-xs text-slate-400">'+(c.course_code||'')+'</div><div class="flex gap-2 mt-3"><span class="px-2 py-0.5 rounded-full text-xs '+(c.subtask_count?'bg-indigo-50 text-indigo-600':'bg-slate-50')+'">'+c.subtask_count+' 子任务</span><span class="px-2 py-0.5 rounded-full text-xs '+(c.is_public===1?'bg-emerald-50 text-emerald-600':(c.is_public===2?'bg-amber-50 text-amber-600':'bg-slate-50'))+'">'+(c.is_public===1?'公开':(c.is_public===2?'待审核':'私有'))+'</span><button class="ml-auto px-2 py-0.5 rounded-full text-xs bg-red-50 text-red-600 hover:bg-red-100" onclick="event.stopPropagation();deleteCourse('+c.id+',this)"><iconify-icon icon="lucide:trash-2" class="align-middle"></iconify-icon> 删除</button></div></div>';
    });
    document.getElementById('courses-grid').innerHTML=h||'<p class="text-slate-400 text-center py-12 col-span-3">暂无课程</p>';
    // Attach click handlers
    document.querySelectorAll('#courses-grid [data-cid]').forEach(function(el){
      el.onclick=function(){ showSubtasks(parseInt(this.dataset.cid)); };
    });
  }catch(e){}
}
async function showSubtasks(cid){
  var r=await apiFetch('/courses/'+cid+'/subtasks');var subs=Array.isArray(r)?r:(r.subtasks||[]);
  var modal=document.getElementById('modal-subtasks');
  var title=document.getElementById('subtasks-title');
  var body=document.getElementById('subtasks-body');
  if(!subs.length){title.innerText='子任务';body.innerHTML='<p class="text-slate-400 text-center py-10">该课程暂无子任务</p>';modal.classList.remove('hidden');return}
  title.innerText='子任务 ('+subs.length+')';
  var h='';
  subs.forEach(function(s,i){
    h+='<div class="border border-slate-200 rounded-xl p-4 mb-3">'
      +'<div class="flex items-start gap-2 mb-2"><span class="flex-none w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 text-xs font-bold flex items-center justify-center">'+(i+1)+'</span>'
      +'<div class="font-semibold text-sm text-slate-800">'+(s.name||'')+'</div></div>';
    if(s.command){h+='<div class="ml-8 mb-2"><div class="text-[10px] uppercase text-slate-400 mb-1">执行命令</div><pre class="text-xs bg-slate-900 text-emerald-300 rounded-lg p-2.5 overflow-x-auto whitespace-pre-wrap">'+escapeHtml(s.command)+'</pre></div>'}
    if(s.expected_output){h+='<div class="ml-8 mb-2 text-xs"><span class="text-slate-400">预期输出：</span><span class="text-slate-600">'+escapeHtml(s.expected_output)+'</span></div>'}
    if(s.knowledge_text){h+='<div class="ml-8 text-xs"><span class="text-violet-400">知识点：</span><span class="text-slate-600">'+escapeHtml(s.knowledge_text)+'</span></div>'}
    h+='</div>';
  });
  body.innerHTML=h;
  modal.classList.remove('hidden');
}
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function deleteCourse(cid,btn){
  var card=btn.closest('[data-cname]');var cname=card?card.dataset.cname:'该课程';
  if(!confirm('确定删除课程「'+cname+'」？\n将级联清理子任务、进度、对话、报告等数据，不可恢复。'))return;
  try{await apiFetch('/courses/'+cid,{method:'DELETE'});toast('课程已删除','success');loadCourses();}
  catch(e){toast('删除失败: '+e.message,'error');}
}

// === CREATE COURSE ===
// === Course Creation (AI) ===
function my_closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function showCreateCourse() { document.getElementById('modal-course').classList.remove('hidden'); }
function showAiGenerate() { document.getElementById('modal-course').classList.remove('hidden'); }

var _aiFile = null;
function ai_onFileChange(input) { _aiFile = input.files[0]; document.getElementById('ai-file-name').innerText = _aiFile ? _aiFile.name : '未选择文件'; }

async function aiGenerateCourse() {
  var prompt = document.getElementById('input-ai-prompt').value.trim();
  if (!prompt) return;
  var btn = document.getElementById('btn-ai-generate');
  btn.disabled = true; btn.innerHTML = '<div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> 生成中...';
  try {
    var t = localStorage.getItem('datatutor_token');
    var r = await fetch('/api/ai/generate-course', { method: 'POST', headers: { 'Authorization': 'Bearer ' + t, 'Content-Type':'application/json' }, body: JSON.stringify({prompt: prompt}) });
    if (!r.ok) { var e = await r.json().catch(function(){}); throw new Error((e&&e.error)||'AI 服务异常'); }
    var data = await r.json();
    document.getElementById('input-course-name').value = data.name || '';
    document.getElementById('input-course-desc').value = data.description || '';
    if (data.subtasks && data.subtasks.length > 0) {
      var box = document.getElementById('ai-preview-box');
      var content = document.getElementById('ai-preview-content');
      var h = '<div class="font-semibold text-sm mb-2 text-violet-700">生成子任务 ('+data.subtasks.length+'项)：</div>';
      data.subtasks.forEach(function(s,i){ h += '<div class="text-xs text-slate-600 py-1 border-b border-slate-100 last:border-0">'+(i+1)+'. '+s.name+' <code class="text-[10px] bg-slate-100 px-1 rounded">'+(s.command||'')+'</code></div>'; });
      content.innerHTML = h; box.classList.remove('hidden');
    }
  } catch(e) { alert('AI 生成失败: ' + e.message); }
  btn.disabled = false; btn.innerHTML = '<iconify-icon icon="lucide:sparkles"></iconify-icon> AI 生成实训大纲';
}

async function my_saveCourse() {
  var name = document.getElementById('input-course-name').value.trim();
  var desc = document.getElementById('input-course-desc').value.trim();
  var pub = document.getElementById('input-is-public').checked;
  if (!name) return;
  // Collect subtasks from AI preview
  var subtasks = [];
  var preview = document.getElementById('ai-preview-content');
  if (preview && preview.children.length > 0) {
    var items = preview.querySelectorAll('div.text-xs');
    items.forEach(function(item) {
      var txt = item.textContent.replace(/^\d+\.\s*/, '').trim();
      if (txt) subtasks.push({name: txt, command: ''});
    });
  }
  await apiFetch('/courses', { method: 'POST', body: JSON.stringify({ name: name, description: desc, is_public: pub, subtasks: subtasks }) });
  my_closeModal('modal-course'); loadCourses();
}

// === TEACHERS ===// === TEACHERS ===
async function loadTeachers(){
  var q=document.getElementById('teacher-search').value.trim();
  var r=await apiFetch('/courses/admin/teachers'+(q?'?q='+encodeURIComponent(q):''));
  var ts=Array.isArray(r)?r:(r.teachers||[]);
  var h='<table class="w-full text-sm"><thead><tr class="bg-slate-50"><th class="p-3 text-left">工号</th><th class="p-3 text-left">姓名</th><th class="p-3 text-left">班级</th><th class="p-3 text-left">课程</th></tr></thead><tbody>';
  ts.forEach(function(t){h+='<tr class="border-t"><td class="p-3 font-mono text-xs">'+(t.teacher_id||'-')+'</td><td class="p-3">'+t.display_name+'</td><td class="p-3">'+t.class_count+'</td><td class="p-3">'+t.course_count+'</td></tr>'});
  h+='</tbody></table>';document.getElementById('teacher-list').innerHTML=h;
}
</script>
<!-- Subtasks Detail Modal -->
<div class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40" id="modal-subtasks" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl" onclick="event.stopPropagation()">
    <div class="flex-none p-6 border-b flex items-center justify-between">
      <h3 class="font-bold text-slate-800 text-lg" id="subtasks-title">子任务</h3>
      <button class="text-slate-400 hover:text-slate-600" onclick="document.getElementById('modal-subtasks').classList.add('hidden')"><iconify-icon class="text-xl" icon="lucide:x"></iconify-icon></button>
    </div>
    <div class="flex-1 overflow-y-auto p-6" id="subtasks-body"></div>
  </div>
</div>
<div class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40" id="modal-course" onclick="my_closeModal('modal-course')">
  <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl" onclick="event.stopPropagation()">
    <div class="flex-none p-6 border-b flex items-center justify-between">
      <h3 class="font-bold text-slate-800 text-lg">创建实训课程</h3>
      <button class="text-slate-400 hover:text-slate-600" onclick="my_closeModal('modal-course')"><iconify-icon class="text-xl" icon="lucide:x"></iconify-icon></button>
    </div>
    <div class="flex-1 overflow-y-auto p-6 space-y-5">
      <div class="bg-violet-50 rounded-xl p-5 border border-violet-200">
        <div class="flex items-center justify-between mb-3"><div class="flex items-center gap-2"><iconify-icon class="text-violet-500" icon="lucide:sparkles"></iconify-icon><span class="text-sm font-bold text-violet-700">AI 辅助生成</span></div>
          <div class="flex items-center gap-1.5 bg-white px-2 py-1 rounded-full border border-violet-200"><svg width="14" height="14" viewBox="0 0 1024 1024"><path fill="#7B5BFF" d="M512 64L96 320v416l416 256 416-256V320z"/><path fill="#FFFFFF" d="M512 280c-60 0-108 48-108 108s48 108 108 108 108-48 108-108-48-108-108-108zm0 168c-33 0-60-27-60-60s27-60 60-60 60 27 60 60-27 60-60 60z"/><circle cx="430" cy="340" r="14" fill="#3F2DCB"/><circle cx="594" cy="340" r="14" fill="#3F2DCB"/><path fill="#FFB527" d="M620 200l30-15 30 15-30 15z"/></svg><span class="text-[10px] font-bold text-violet-700">由讯飞星火驱动</span></div>
        </div>
        <p class="text-xs text-violet-600 mb-3">描述实训任务，AI 自动填充课程名称、简介和子任务。</p>
        <textarea class="w-full px-3 py-2.5 bg-white border border-violet-200 rounded-xl text-sm focus:border-violet-400 focus:outline-none focus:ring-2 focus:ring-violet-100 resize-none" id="input-ai-prompt" placeholder="例如：利用Hive对淘宝用户日志进行多维度分析" rows="2"></textarea>
        <div class="flex items-center gap-2 mt-2">
          <input type="file" id="input-ai-file" class="hidden" onchange="ai_onFileChange(this)">
          <button class="px-3 py-1.5 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg hover:bg-amber-100" onclick="document.getElementById('input-ai-file').click()"><iconify-icon icon="lucide:file-up" class="mr-1 align-middle"></iconify-icon>上传数据文件</button>
          <span class="text-xs text-slate-400" id="ai-file-name">未选择文件</span>
        </div>
        <button class="mt-3 w-full py-2.5 bg-violet-600 text-white text-sm font-semibold rounded-lg hover:bg-violet-700 flex items-center justify-center gap-2" id="btn-ai-generate" onclick="aiGenerateCourse()"><iconify-icon icon="lucide:sparkles"></iconify-icon> AI 生成实训大纲</button>
        <div class="hidden mt-3 bg-white rounded-xl border border-slate-200 p-4 max-h-60 overflow-y-auto" id="ai-preview-box"><div class="text-xs text-slate-600 leading-relaxed" id="ai-preview-content"></div></div>
      </div>
      <div class="border-t border-slate-100"></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">课程名称 <span class="text-red-400">*</span></label><input class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100" id="input-course-name" placeholder="如：Hive 数据分析实战"></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">课程描述</label><textarea class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 resize-none" id="input-course-desc" rows="2"></textarea></div>
      <label class="flex items-center gap-2"><input type="checkbox" id="input-is-public" class="rounded"> <span class="text-sm text-slate-600">全站公开</span></label>
    </div>
    <div class="flex-none p-4 border-t flex justify-end gap-3">
      <button class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 rounded-lg" onclick="my_closeModal('modal-course')">取消</button>
      <button class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-lg hover:bg-indigo-700" onclick="my_saveCourse()">保存</button>
    </div>
  </div>
</div>
</body></html>
