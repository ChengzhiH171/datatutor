services:
  app:
    image: datatutor-app:latest
    container_name: datatutor-app
    network_mode: host
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - XUNFEI_API_KEY=${XUNFEI_API_KEY}
      - XUNFEI_API_SECRET=${XUNFEI_API_SECRET}
      - XUNFEI_FLOW_TRAINING=${XUNFEI_FLOW_TRAINING}
      - XUNFEI_FLOW_KNOWLEDGE=${XUNFEI_FLOW_KNOWLEDGE}
      - XUNFEI_FLOW_TEACHER=${XUNFEI_FLOW_TEACHER}
      - XUNFEI_FLOW_REPORT=${XUNFEI_FLOW_REPORT}
      - MYSQL_URL=${MYSQL_URL}
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - DORIS_HOST=127.0.0.1
      - DORIS_PORT=9030
      - DORIS_USER=root
      - DORIS_PASSWORD=
      - DORIS_DB=datatutor_analytics
      - VM_HOST=127.0.0.1
      - VM_USER=root
      - VM_PASSWORD=${VM_PASSWORD}
    restart: unless-stopped
    depends_on:
      - mysql
      - redis

  redis:
    image: redis:7-alpine
    container_name: datatutor-redis
    network_mode: host
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

  mysql:
    image: mysql:8.0
    container_name: datatutor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: datatutor
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
